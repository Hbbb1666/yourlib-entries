<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --line: #e4e7ec;

      --text: #e6e8ec;
      --muted: #a2a9b4;
      --faint: #767d88;
      --accent: #8ea2ff;
      --stable: #6fd0a5;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);

    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 40px 20px 72px; }

  header h1 { margin: 0 0 6px; font-size: 27px; letter-spacing: -0.01em; }
  header .sub { margin: 0; color: var(--muted); }
  header .meta { margin: 10px 0 0; color: var(--faint); font-size: 13px; }

  .controls {
    position: sticky; top: 0; z-index: 5;
    margin: 22px 0 8px; padding: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .controls input {
    flex: 1 1 220px; min-width: 180px;
    padding: 9px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  .controls input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 999px;
  }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: var(--accent); }

  section { margin-top: 34px; }
  section h2 {
    margin: 0 0 4px; font-size: 19px;
    display: flex; align-items: baseline; gap: 10px;
  }
  section h2 .n { color: var(--faint); font-size: 13px; font-weight: 400; }
  section .lede { margin: 0 0 14px; color: var(--muted); font-size: 14px; }

  .entry {
    padding: 14px 16px; margin-bottom: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--stable); border-radius: 10px;
  }
  .entry[data-tier="AGGRESSIVE"] { border-left-color: var(--aggr); }
  .entry[data-tier="CONFIGURED"] { border-left-color: var(--conf); }
  .entry[hidden] { display: none; }
  .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .name {
    font-family: var(--mono); font-size: 14px; color: var(--text);
    text-decoration: none; word-break: break-all;
  }
  .name:hover { color: var(--accent); text-decoration: underline; }
  .badge {
    margin-left: auto; padding: 2px 9px; font-size: 12px; white-space: nowrap;
    border-radius: 999px; color: var(--stable); background: var(--stable-bg);
  }
  .entry[data-tier="AGGRESSIVE"] .badge { color: var(--aggr); background: var(--aggr-bg); }
  .entry[data-tier="CONFIGURED"] .badge { color: var(--conf); background: var(--conf-bg); }
  .desc { margin: 8px 0 0; }
  .meta { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 12px; padding: 2px 8px; border-radius: 6px;
    color: var(--muted); background: var(--bg); border: 1px solid var(--line);
  }
  .tag.recipe { color: var(--accent); }
  .en { margin: 8px 0 0; color: var(--faint); font-size: 13px; }

  .empty { margin-top: 30px; color: var(--muted); }
  footer {
    margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line);
    color: var(--faint); font-size: 13px;
  }
  footer a { color: var(--accent); }
</style>
</head>

const ENTRIES = [{"family":"ATTACK","tier":"AGGRESSIVE","name":"ControlFlags","desc":"反射中和目标自身的死亡门控字段，让正常死亡流程能走完。","summary":"Write the permissive value into a boss's own kill-gate flags, so the normal death pipeline can finish.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"KillChain","desc":"分层击杀链：按层执行（伤害层、状态改写层），用于处理常规伤害杀不掉的目标。","summary":"Ordered kill pipeline: a damage layer plus a state-override layer, run in the order you choose.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"PenetrationRequest","desc":"一次穿透表态：声明这一击要无视哪些防御。","summary":"A request to let a death through despite cancel requests.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"TrueDamage","desc":"真实伤害：直接扣血（不经过 hurt，因此不触发 Forge 伤害事件）","summary":"Direct health subtraction. No hurt() call, so no Forge damage event fires and no defence sees it.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"WeaponHandle#absolutePenetration","desc":"全穿透：无视全部可穿透的防御类型。","summary":"Ignore every defence type at ratio 1.0: armour, enchantments, resistance, caps.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"WeaponHandle#anchoredDamage","desc":"锚定伤害：把这一击的落地值钉死成该数值，同时是地板与天花板。","summary":"Pin the landed damage to one exact value: floor and cap at once, re-asserted at setHealth.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"WeaponHandle#damageDebt","desc":"让这一击延迟结算（伤害债务），可带倍率。","summary":"Defer the damage: nothing lands now, the same blow lands later as a direct health write. | Deferred damage with a multiplier, for a debt worse than the hit that created it.","requires":"","recipes":"one-shot-artifact,damage-over-time-weapon"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"WeaponHandle#ignoreReduction","desc":"忽略通用减伤；可带一个免疫率。","summary":"Keep YourLib's computed damage and refuse the value the game reduced it to.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"WeaponHandle#movementLock","desc":"记录这件武器的移动限制类型。","summary":"The victim cannot teleport, change dimension or be moved by command after the hit.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"YourLibCombat#attackerPenetration","desc":"佩戴者穿透光环：给某个攻击者挂一层穿透，它挥出的任何武器（含未经 YourLib 登记的普通武器）都吃这层加成","summary":"Aura: everything this attacker swings gains this penetration, even unconfigured weapons.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"YourLibCombat#forceDeath","desc":"强制穿透目标的免死，让正常死亡流程走完。","summary":"Pierce immortality: this entity's death requests are ignored for the next death.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"YourLibCombat#kill","desc":"对目标执行分层击杀链（伤害层 + 状态改写层）。","summary":"Run the layered kill chain: damage layer plus state override.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"YourLibCombat#trueDamage","desc":"直接扣血，绕过 hurt 与全部防御。","summary":"Subtract health directly: no hurt() call, so no Forge damage event and no defence.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"AGGRESSIVE","name":"YourLibDebt","desc":"伤害债务：这一击延迟若干 tick 后用直扣血结算，瞬移、无敌帧与复活都躲不开。","summary":"Deferred damage: a recorded blow that lands later as a direct health write, so it cannot be dodged.","requires":"","recipes":"one-shot-artifact,damage-over-time-weapon"},{"family":"ATTACK","tier":"STABLE","name":"CombatProfile","desc":"某件武器的整套战斗配置（穿透、减伤免疫、锚定伤害、移动限制、来源免疫），由伤害管线读取。","summary":"Live per-weapon configuration read by the damage pipeline; a WeaponHandle writes here.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"STABLE","name":"CritLevel","desc":"STABLE / AGGRESSIVE","summary":"Descriptive label for a crit configuration; it gates nothing.","requires":"","recipes":""},{"family":"ATTACK","tier":"STABLE","name":"DefenseType","desc":"PERCENTAGE_REDUCTION, ENCHANTMENT_PROTECTION, TAG_BASED_IMMUNITY, RESISTANCE_EFFECT, POTION_IMMUNITY, DAMAGE_CAP, TOTEM_REVIVAL, INVULNERABILITY_FRAMES, CUSTOM_REGISTRY, FORGE_EVENT_DEFENSE（[激进]）, INDEPENDENT_DAMAGE_LISTENER（[激进]）","summary":"The kinds of defence a penetration profile can be aimed at.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"STABLE","name":"PenetrationPriority","desc":"ABSOLUTE / CONDITIONAL / NONE","summary":"ABSOLUTE ignores every cancel; CONDITIONAL only wins when no BLOCKING cancel is present.","requires":"","recipes":""},{"family":"ATTACK","tier":"STABLE","name":"WeaponHandle","desc":"某件武器的链式配置句柄；每个方法设置一项并返回自身，可以一路链下去。","summary":"Fluent configuration of one weapon; every setter writes into the live registries.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"STABLE","name":"WeaponHandle#clearAnchoredDamage","desc":"取消锚定伤害。","summary":"Drop the anchor and go back to the normal damage pipeline.","requires":"","recipes":""},{"family":"ATTACK","tier":"STABLE","name":"WeaponHandle#clearDamageDebt","desc":"取消伤害债务。","summary":"Land the damage immediately again.","requires":"","recipes":""},{"family":"ATTACK","tier":"STABLE","name":"WeaponHandle#clearTargetTag","desc":"清除命中标记。","summary":"Stop stamping targets with the wielder's UUID.","requires":"","recipes":""},{"family":"ATTACK","tier":"STABLE","name":"WeaponHandle#crit","desc":"给这件武器设置暴击几率与倍率。","summary":"Register this weapon's crit chance and multiplier.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"STABLE","name":"WeaponHandle#penetration","desc":"指定这一击瞄准哪些防御类型、以及穿透比例。","summary":"Ignore the listed defence types by ratio: 0 keeps them fully, 1 ignores them.","requires":"","recipes":"one-shot-artifact"},{"family":"ATTACK","tier":"STABLE","name":"WeaponHandle#profile","desc":"取这件武器背后 inted on first use and survives copies.","requires":"","recipes":"one-shot-artifact"},{"family":"DEFENCE","tier":"AGGRESSIVE","name":"YourLibCombat#healBlock","desc":"禁止该实体以任何方式恢复生命，包括直接写血量。","summary":"No healing by any route, including a direct setHealth write.","requires":"","recipes":"invincible-belt,boss-phase-lock"},{"family":"DEFENCE","tier":"AGGRESSIVE","name":"YourLibCombat#healthLock","desc":"锁血：血量不会被写到该值以下，查询至少返回该值。","summary":"Health cannot be written below this value, and getHealth reports at least it.","requires":"","recipes":"invincible-belt"},{"family":"DEFENCE","tier":"AGGRESSIVE","name":"YourLibCombat#immortality","desc":"免死：死亡事件层拦截并回填血量。","summary":"Death is cancelled and health restored to this fraction of maximum.","requires":"","recipes":"invincible-belt"},{"family":"DEFENCE","tier":"AGGRESSIVE","name":"YourLibGuard","desc":"链式配置一个受保护实体：锁血、硬化、图腾封锁、来源免疫一次配齐。","summary":"Fluent guard for one entity: health lock, hardening, totem block, source immunity.","requires":"","recipes":"invincible-belt"},{"family":"DEFENCE","tier":"AGGRESSIVE","name":"YourLibHardening","desc":"让实体拒绝 die/remove、恒报未濒死","summary":"Hardened state: the entity refuses die() and remove(), and reports itself as not dying.","requires":"","recipes":"invincible-belt"},{"family":"DEFENCE","tier":"AGGRESSIVE","name":"YourLibReflect","desc":"伤害反弹：受击者按比例把伤害打回攻击者，带链深上限防止双方无限互弹。","summary":"Reflect a share of any blow back at whoever landed it, with a chain-depth limit.","requires":"","recipes":"invincible-belt,reflect-armor"},{"family":"DEFENCE","tier":"AGGRESSIVE","name":"YourLibSeal","desc":"封锁：剥夺目标的恢复与复活途径（治疗、图腾、死亡后再生）。","summary":"Seal: no totem revive, no healing by any route, and no death-spawn replacement.","requires":"","recipes":"boss-phase-lock,invincible-belt"},{"family":"DEFENCE","tier":"STABLE","name":"BoundItemRegistry","desc":"绑定注册表（写入世界存档）","summary":"Two-way registry of bound items, with an NBT save/load round trip for the world save.","requires":"","recipes":"soulbound-item"},{"family":"DEFENCE","tier":"STABLE","name":"CancelPriority","desc":"BLOCKING / DEFERRED","summary":"BLOCKING is a last resort that outperforms penetration; DEFERRED yields to it.","requires":"","recipes":"invincible-belt"},{"family":"DEFENCE","tier":"STABLE","name":"CancelRequest","desc":"一次免死表态：先拦下（BLOCKING），或延后处理（DEFERRED）。","summary":"A request to stop a death, with the health to restore if it wins.","requires":"","recipes":"invincible-belt"},{"family":"DEFENCE","tier":"STABLE","name":"Decision","desc":"裁决结果：cancelDeath() / restoreHealth()","summary":"The arbitration result: whether to cancel the death and how much health to put back.","requires":"","recipes":"invincible-belt"},{"family":"DEFENCE","tier":"STABLE","name":"ProtectionFlags","desc":"FIRE, CACTUS, ANVIL, FLOAT, VOID_RETURN, GLOW","summary":"The environmental ways an item can be destroyed or lost, one flag each.","requires":"","recipes":"soulbound-item"},{"family":"DEFENCE","tier":"STABLE","name":"YourLibCombat","desc":"战斗门面：免死、锁血、禁疗、来源免疫、击退免疫、逐武器配置、真伤与击杀链都从这里取。","summary":"Central registry for combat state: per-weapon profiles plus the per-entity defence ","requires":"","recipes":"one-shot-artifact,invincible-belt"},{"family":"DEFENCE","tier":"STABLE","name":"YourLibCombat#knockbackImmunity","desc":"击退免疫：事件层取消 LivingKnockBackEvent（HIGHEST），不是改位移系数","summary":"Cannot be knocked back: the knockback event is cancelled, not just damped.","requires":"","recipes":"invincible-belt"},{"family":"DEFENCE","tier":"STABLE","name":"YourLibCombat#sourceImmunity","desc":"对来自指定攻击者的伤害免疫（在攻击事件层取消）。","summary":"Become immune to damage whose source is this attacker (cancels the attack event).","requires":"","recipes":"invincible-belt"},{"family":"DEFENCE","tier":"STABLE","name":"YourLibProtection","desc":"不得损坏标志：防火、防仙人掌、防铁砧、防漂浮消失、掉入虚空返还、轮廓发光。","summary":"Indestructible-item flags per item id: fire, cactus, anvil, float, void return.","requires":"","recipes":"soulbound-item"},{"family":"DEFENCE","tier":"STABLE","name":"YourLibUnremovable","desc":"灵魂绑定：物品记住主人与完整快照，被丢弃、被指令清除或随死亡掉落时都能回到主人手中。","summary":"Soul binding: the item remembers its owner and can be handed back with forceGive.","requires":"","recipes":"soulbound-item"},{"family":"STATE","tier":"CONFIGURED","name":"BuffRemoval","desc":"NORMAL / SERVER_FORCE","summary":"How a removal is requested; SERVER_FORCE only works when the server config allows it.","requires":"config/yourlib-buffs.json -> allowServerForceRemoval","recipes":"boss-phase-lock"},{"family":"STATE","tier":"STABLE","name":"ItemKey","desc":"逐物品栈的稳定 UUID；物品副本会带走同一个 id。","summary":"Stable per-stack id in NBT; an empty stack answers with a sentinel and is never written to.","requires":"","recipes":"soulbound-item"},{"family":"STATE","tier":"STABLE","name":"TagLevel","desc":"STABLE / AGGRESSIVE","summary":"How strongly a tag is meant: STABLE for ordinary content, AGGRESSIVE for absolute effects.","requires":"","recipes":""},{"family":"STATE","tier":"STABLE","name":"YourLibBuffs","desc":"独立于原版效果的定时 Buff，支持定义不可清除的 Buff。","summary":"Independent timed buffs, optionally unremovable; nothing here touches MobEffect.","requires":"","recipes":"boss-phase-lock"},{"family":"STATE","tier":"STABLE","name":"YourLibTags","desc":"分级 UUID 标记：为实体打稳定级或激进级标记，并承载移动限制、图腾封锁等开关。","summary":"UUID tag table keyed by entity id, with a level per tag; the base other systems build on.","requires":"","recipes":"boss-phase-lock,invincible-belt"},{"family":"MARKS","tier":"STABLE","name":"YourLibMarks","desc":"关联标记：宿敌、目标标记、追踪绑定、护盾绑定与绑定守护者。","summary":"Typed relationships between entities: nemesis, tracking, shield, guardian, target tag.","requires":"","recipes":"nemesis-system,tracked-projectile,invincible-belt"},{"family":"MOVEMENT","tier":"STABLE","name":"MovementLockType","desc":"TELEPORT, DIMENSION, COMMAND_TP, POSITION_MODIFY（后一项为预留）","summary":"The movement options a locked entity loses: teleport, dimension change, command teleport.","requires":"","recipes":"one-shot-artifact"},{"family":"MOVEMENT","tier":"STABLE","name":"YourLibJump","desc":"跳跃高度乘数；只在客户端生效，因为跳跃冲量只存在于跑物理的那一侧。","summary":"Jump height multiplier per entity. Applied on the client, where a player's jump impulse exists.","requires":"","recipes":""},{"family":"RENDER","tier":"STABLE","name":"ShaderQuality","desc":"LOW / NORMAL / HIGH，配 ShaderQuality.parse(name, fallback)；由 YourLibClientSettings#shaderQuality 读取","summary":"Drawing tier: LOW drops the heaviest world-effect patterns, NORMAL and HIGH draw all.","requires":"","recipes":"invincible-belt"},{"family":"RENDER","tier":"STABLE","name":"YourLibClientSettings","desc":"运行时读写；apply(json) 先校验后赋值，reset() 回默认","summary":"Client knobs: effect budget and distance, tooltip takeover, drawing quality tier.","requires":"","recipes":"invincible-belt"},{"family":"RENDER","tier":"STABLE","name":"YourLibEffects","desc":"世界特效定义注册表","summary":"World-effect definition registry; the four built-in patterns are driven by YourLibEffectsImpl.","requires":"","recipes":"one-shot-artifact,invincible-belt"},{"family":"RENDER","tier":"STABLE","name":"YourLibHud","desc":"物品往 HUD 挂状态行；供应器返回 null 即不绘制","summary":"HUD lines contributed by items; a supplier returning null simply draws nothing.","requires":"","recipes":"invincible-belt"},{"family":"RENDER","tier":"STABLE","name":"YourLibShaders","desc":"着色器定义注册表（注册表已就绪，GLSL 载荷待补）","summary":"Shader definition registry; the definition surface is ready, the GLSL payload is not.","requires":"not implemented: the registry records definitions, no payload renders yet","recipes":""},{"family":"RENDER","tier":"STABLE","name":"YourLibTextEffects","desc":"文字动画注册表：给一行文字加浮动、渐变等效果，内置两组预设。","summary":"Animated text: mark a tooltip line and the client floats and gradients it per character.","requires":"","recipes":"one-shot-artifact,invincible-belt"},{"family":"RENDER","tier":"STABLE","name":"YourLibTooltips","desc":"悬停面板定义：短行常显，detail 行按住 Shift 才显示；overrideVanilla(true) 表示完全接管原版 tooltip","summary":"Hover panel definitions: always-visible lines plus shift-only detail lines, drawn by the client.","requires":"","recipes":"one-shot-artifact,invincible-belt"},{"family":"EVENT","tier":"STABLE","name":"YourEvent","desc":"自有事件基类（不继承 Forge Event）","summary":"Base class for YourLib's own events; it does not extend the Forge event type.","requires":"","recipes":"invincible-belt"},{"family":"EVENT","tier":"STABLE","name":"YourEventBus","desc":"Lambda 注册，无反射开销","summary":"YourLib's own bus: lambda registration, per-listener exception isolation, duplicate dedupe.","requires":"","recipes":"invincible-belt"},{"family":"EVENT","tier":"STABLE","name":"YourPreDeathEvent","desc":"免死裁决事件，含 entity() / maxHealth() / requestCancel() / requestPenetration()","summary":"Fired before a death is applied: submit cancel or penetration requests and the decision maker arbitrates.","requires":"","recipes":"invincible-belt"},{"family":"COMPAT","tier":"STABLE","name":"YourLibCompat","desc":"兼容探针：检测常见前置库与冲突源，并按结果调整自身行为。","summary":"Which companion libraries are present, and whether an event-dispatch overlay is active.","requires":"","recipes":"invincible-belt"}];

const FAMILY = {
  ATTACK:   { title: '攻击库',       lede: '配置单件武器、佩戴者光环、暴击与击杀链；决定这一击最终打出多少。' },
  DEFENCE:  { title: '防御库',       lede: '免死、锁血、硬化、图腾封锁、来源免疫、反弹与守护。' },
  STATE:    { title: 'Buff 库（状态与标记）', lede: '不占用原版效果通道的定时 Buff，以及带分级的 UUID 标记。' },
  MARKS:    { title: '附录 · 关联标记', lede: '宿敌、目标标记、追踪绑定、护盾绑定、绑定守护者。' },
  MOVEMENT: { title: '附录 · 移动与跳跃', lede: '传送限制与跳跃高度乘数。' },
  RENDER:   { title: '附录 · 渲染与视觉', lede: '世界特效、着色器、悬停面板、动态文字与 HUD。' },
  EVENT:    { title: '附录 · 事件与调度', lede: '自有事件总线与免死裁决事件。' },
  COMPAT:   { title: '附录 · 兼容',     lede: '冲突检测与条件适配。' }
};
const ORDER = ['ATTACK', 'DEFENCE', 'STATE', 'MARKS', 'MOVEMENT', 'RENDER', 'EVENT', 'COMPAT'];
const TIER_LABEL = { STABLE: '稳定级', AGGRESSIVE: '激进级', CONFIGURED: '需配置', INTERNAL: '内部' };

const anchor = (name) => 'e-' + name.replace(/[#.]/g, '-');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function card(e) {
  const recipes = String(e.recipes || '').split(',').map((s) => s.trim()).filter(Boolean);
  const tags = [];
  if (recipes.length) tags.push('<span class="tag recipe">配方：' + recipes.map(esc).join(' · ') + '</span>');
  if (e.requires && e.requires !== 'none') tags.push('<span class="tag">需要：' + esc(e.requires) + '</span>');
  const en = e.desc ? '<p class="en">' + esc(e.summary) + '</p>' : '';
  return '<article class="entry" id="' + anchor(e.name) + '" data-tier="' + e.tier + '" data-family="' + e.family + '">'
    + '<div class="head"><a class="name" href="#' + anchor(e.name) + '">' + esc(e.name) + '</a>'
    + '<span class="badge">' + (TIER_LABEL[e.tier] || e.tier) + '</span></div>'
    + '<p class="desc">' + esc(e.desc || e.summary) + '</p>'
    + (tags.length ? '<p class="meta">' + tags.join('') + '</p>' : '')
    + en
    + '</article>';
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = ORDER.filter((f) => ENTRIES.some((e) => e.family === f)).map((f) => {
    const list = ENTRIES.filter((e) => e.family === f);
    const info = FAMILY[f];
    return '<section id="' + f.toLowerCase() + '"><h2>' + info.title
      + '<span class="n">' + list.length + ' 条</span></h2>'
      + '<p class="lede">' + info.lede + '</p>'
      + list.map(card).join('') + '</section>';
  }).join('');
  document.getElementById('total').textContent = ENTRIES.length;
  apply();
}

let tier = 'ALL';
function apply() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('.entry').forEach((el) => {
    const data = ENTRIES.find((e) => anchor(e.name) === el.id);
    const hitTier = tier === 'ALL' || data.tier === tier;
    const hay = (data.name + ' ' + (data.desc || '') + ' ' + data.summary).toLowerCase();
    const hitText = q === '' || hay.includes(q);
    const ok = hitTier && hitText;
    el.hidden = !ok;
    if (ok) shown++;
  });
  document.querySelectorAll('section').forEach((s) => {
    s.hidden = !Array.from(s.querySelectorAll('.entry')).some((e) => !e.hidden);
  });
  document.getElementById('empty').hidden = shown !== 0;
}

document.getElementById('q').addEventListener('input', apply);
document.querySelectorAll('#tierChips .chip').forEach((btn) => {
  btn.addEventListener('click', () => {
    tier = btn.dataset.tier;
    document.querySelectorAll('#tierChips .chip').forEach((b) =>
      b.setAttribute('aria-pressed', String(b === btn)));
    apply();
  });
});

render();
</script>
</body>
</html>
